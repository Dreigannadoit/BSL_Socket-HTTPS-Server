<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Balls || Testing</title>

    <link rel="stylesheet" href="/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="hud">
        <img src="assets/IconMe_animated.svg" alt="">
        <br>
        <h1>A Drei Abmab© Project</h1>
    </div>


    <script type="module">

        import { fetchAssetBlobURL }
            from "/modules/binaryAssetLoader.js";


        // ============================================
        // LOAD ASSETS
        // ============================================

        async function loadAssets() {

            const elements =
                document.querySelectorAll("[data-b64-src]");

            for (const el of elements) {

                const file =
                    el.getAttribute("data-b64-src");

                const type =
                    el.getAttribute("data-b64-type");

                try {

                    const blobUrl =
                        await fetchAssetBlobURL("/" + file, type);

                    el.src = blobUrl;

                    if (el.tagName === "VIDEO") {
                        el.load();
                    }

                } catch (err) {

                    console.error(
                        `Failed to load ${file}:`,
                        err
                    );

                }

            }

        }

        // ============================================
        // INITIALIZE
        // ============================================

        document.addEventListener("DOMContentLoaded", () => {
            loadAssets();

        });

    </script>

</body>

</html>
