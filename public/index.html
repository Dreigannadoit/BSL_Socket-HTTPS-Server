            <style>
                .head {
                    transform-box: fill-box;
                    transform-origin: 50% 60%;
                    animation: head-bob 2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
                }

                .hair {
                    transform-box: fill-box;
                    transform-origin: 50% 20%;
                    animation: hair-sway 2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
                }

                .eye {
                    transform-box: fill-box;
                    transform-origin: center;
                }

                .eye-right {
                    animation: blink-right 2s ease-in-out infinite;
                }

                .eye-left {
                    animation: blink-left 2s ease-in-out infinite;
                }

                .brow {
                    transform-box: fill-box;
                    transform-origin: center;
                }

                .brow-left {
                    animation: brow-left 2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                }

                .brow-right {
                    animation: brow-right 2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
                }

                .mouth {
                    transform-box: fill-box;
                    transform-origin: center;
                    animation: mouth-talk 1s ease-in-out infinite;
                }

                .nose {
                    transform-box: fill-box;
                    transform-origin: top center;
                    animation: nose-wiggle 2s ease-in-out infinite;
                }

                .chin-lines {
                    transform-box: fill-box;
                    transform-origin: center;
                    animation: chin-sway 2s ease-in-out infinite;
                }

                @keyframes head-bob {

                    0%,
                    100% {
                        transform: translateY(0) rotate(0deg);
                    }

                    25% {
                        transform: translateY(-8px) rotate(-1.5deg);
                    }

                    50% {
                        transform: translateY(0) rotate(0deg);
                    }

                    75% {
                        transform: translateY(-4px) rotate(1.5deg);
                    }
                }

                @keyframes hair-sway {

                    0%,
                    100% {
                        transform: translateY(0) rotate(0deg) scale(1);
                    }

                    25% {
                        transform: translateY(-6px) rotate(-2deg) scale(1.01);
                    }

                    50% {
                        transform: translateY(0) rotate(0deg) scale(1);
                    }

                    75% {
                        transform: translateY(-3px) rotate(2deg) scale(1.008);
                    }
                }

                @keyframes blink-right {

                    0%,
                    78%,
                    100% {
                        transform: scaleY(1);
                    }

                    81% {
                        transform: scaleY(0.05);
                    }

                    84% {
                        transform: scaleY(1);
                    }

                    90% {
                        transform: scaleY(1);
                    }

                    93% {
                        transform: scaleY(0.05);
                    }

                    96% {
                        transform: scaleY(1);
                    }
                }

                @keyframes blink-left {

                    0%,
                    78%,
                    100% {
                        transform: scaleY(1);
                    }

                    81% {
                        transform: scaleY(0.05);
                    }

                    84% {
                        transform: scaleY(1);
                    }

                    /* skips the second blink so it reads as a wink */
                }

                @keyframes brow-left {

                    0%,
                    75%,
                    100% {
                        transform: translateY(0) rotate(0deg);
                    }

                    80% {
                        transform: translateY(-9px) rotate(-4deg);
                    }

                    90% {
                        transform: translateY(0) rotate(0deg);
                    }
                }

                @keyframes brow-right {

                    0%,
                    75%,
                    100% {
                        transform: translateY(0) rotate(0deg);
                    }

                    80% {
                        transform: translateY(-3px) rotate(1deg);
                    }

                    90% {
                        transform: translateY(0) rotate(0deg);
                    }
                }

                @keyframes mouth-talk {

                    0%,
                    100% {
                        transform: scale(1, 1) translateY(0);
                    }

                    20% {
                        transform: scale(0.85, 1.25) translateY(2px);
                    }

                    40% {
                        transform: scale(1.1, 0.8) translateY(-2px);
                    }

                    60% {
                        transform: scale(0.9, 1.15) translateY(1px);
                    }

                    80% {
                        transform: scale(1.05, 0.9) translateY(-1px);
                    }
                }

                @keyframes nose-wiggle {

                    0%,
                    100% {
                        transform: translateX(0) rotate(0deg);
                    }

                    50% {
                        transform: translateX(2px) rotate(2deg);
                    }
                }

                @keyframes chin-sway {

                    0%,
                    100% {
                        transform: rotate(0deg) translateY(0);
                    }

                    25% {
                        transform: rotate(-2deg) translateY(2px);
                    }

                    75% {
                        transform: rotate(2deg) translateY(-2px);
                    }
                }
            </style>
